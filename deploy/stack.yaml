AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shuhul on one EC2 machine behind CloudFront. The machine runs the database,
  API, worker and website with Docker Compose. It takes the code and the
  processed dataset from S3 when it first starts.

Parameters:
  DataBucket:
    Type: String
    Description: >
      Bucket that already holds the processed dataset under processed/ and
      the code archive named by ReleaseKey.
  ReleaseKey:
    Type: String
    Default: release/shuhul.tar.gz
    Description: Where in the bucket the code archive is (made with git archive).
  CloudFrontPrefixList:
    Type: String
    Description: >
      Id of the managed prefix list com.amazonaws.global.cloudfront.origin-facing
      in this region, so that only CloudFront can reach the machine.
  InstanceType:
    Type: String
    Default: t3.large
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  BedrockModelId:
    Type: String
    Default: ""
    Description: Model or inference profile for analysing reports. Empty keeps it off.

Resources:
  # ---------- What the machine is allowed to do ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shuhul-ec2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Shell access through Session Manager, so no SSH port or key is needed.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: shuhul-read-dataset
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${DataBucket}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${DataBucket}/*
        - PolicyName: shuhul-analyse-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: shuhul-ec2
      Roles:
        - !Ref InstanceRole

  # ---------- The machine ----------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Shuhul website, reachable from CloudFront only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList
          Description: CloudFront edge servers

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt WebSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
        # Two hops, so the containers can use the machine's role.
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: shuhul
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # First start: install Docker, fetch the code and the dataset from S3, start the app.
          # The log is at /var/log/shuhul-setup.log and in the EC2 console output.
          set -euxo pipefail
          exec > >(tee /var/log/shuhul-setup.log | logger -t shuhul-setup -s 2>/dev/console) 2>&1

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2
          snap install aws-cli --classic

          mkdir -p /srv/shuhul /srv/shuhul-data/processed
          /snap/bin/aws s3 cp s3://${DataBucket}/${ReleaseKey} /tmp/shuhul.tar.gz --only-show-errors
          tar -xzf /tmp/shuhul.tar.gz -C /srv/shuhul

          /snap/bin/aws s3 sync s3://${DataBucket}/processed /srv/shuhul-data/processed --only-show-errors

          cd /srv/shuhul
          umask 077
          cat > .env <<EOF
          SHUHUL_SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          SHUHUL_DATA_DIR=/srv/shuhul-data/processed
          SHUHUL_TILE_BASE_URL=/api/tiles
          SHUHUL_WATCH_REFRESH_HOURS=3
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          SHUHUL_BEDROCK_MODEL_ID=${BedrockModelId}
          EOF

          docker compose up -d --build
          echo "Shuhul setup finished"

  # ---------- HTTPS and caching in front of it ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Shuhul
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: app
            DomainName: !GetAtt Instance.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        # Pages: always fresh, so a new release shows at once.
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
        CacheBehaviors:
          # Map tiles are the same for everyone and change only on a rebuild.
          - PathPattern: /api/tiles/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          # Everything else under /api is per user and never cached.
          - PathPattern: /api/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
          # Built files carry a hash in their name.
          - PathPattern: /assets/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized

Outputs:
  SiteUrl:
    Description: Where Shuhul is served.
    Value: !Sub https://${Distribution.DomainName}
  InstanceId:
    Value: !Ref Instance
  SetupLog:
    Description: Command that shows how the first start went.
    Value: !Sub aws ec2 get-console-output --instance-id ${Instance} --latest --output text --region ${AWS::Region}
